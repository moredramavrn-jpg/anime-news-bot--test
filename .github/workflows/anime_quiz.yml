name: Anime Quiz

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyTelegramBotAPI google-genai

      - name: Run anime_quiz.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python anime_quiz.py

      - name: Commit and push state
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_quiz_type.txt last_media_type.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Авто-сохранение памяти бота"
          git push
