name: Anime Riddle Poll

on:
  schedule:
    - cron: '0 12 * * *'   # каждый день в 12:00 UTC (можно изменить)
  workflow_dispatch:        # позволяет запускать вручную

permissions:
  contents: write

jobs:
  riddle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyTelegramBotAPI

      - name: Run anime_riddle.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GIGACHAT_AUTHORIZATION_KEY: ${{ secrets.GIGACHAT_AUTHORIZATION_KEY }}
        run: python anime_riddle.py
