name: AI Anime Meme Bot

on:
  schedule:
    # Запуск каждые 4 часа (можешь изменить под себя)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions в GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI requests pillow urllib3

      - name: Run meme generator script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GIGACHAT_AUTHORIZATION_KEY: ${{ secrets.GIGACHAT_AUTHORIZATION_KEY }}
        run: |
          python ai_meme_generator.py
